<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Nuevo usuario')}"></head>
<body class="admin-layout">
<aside th:replace="~{fragments/sidebar :: sidebar('usuarios')}"></aside>
<div class="admin-shell">
    <header th:replace="~{fragments/navbar :: navbar}"></header>
    <main class="admin-content">
        <div class="page-heading">
            <div><p class="eyebrow">Administración</p><h1>Nuevo usuario</h1><p class="text-secondary mb-0">Registra los datos y el rol de acceso.</p></div>
            <a class="btn btn-outline-secondary" th:href="@{/usuarios}">Volver al listado</a>
        </div>
        <section class="card mx-auto" style="max-width: 760px;" aria-labelledby="datos-title">
            <div class="card-header"><h2 id="datos-title" class="h6 mb-0">Datos del usuario</h2></div>
            <div class="card-body p-4">
                <form th:action="@{/usuarios/guardar}" th:object="${formulario}" method="post">
                    <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger" role="alert"><p class="mb-0" th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p></div>
                    <p class="form-text mt-0 mb-4">Todos los campos son obligatorios.</p>
                    <div class="mb-3">
                        <label for="nombre" class="form-label">Nombre</label>
                        <input id="nombre" th:field="*{nombre}" class="form-control" th:errorclass="is-invalid" aria-describedby="nombre-error" maxlength="100" autocomplete="name" required>
                        <div id="nombre-error" class="invalid-feedback" th:errors="*{nombre}"></div>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" id="email" th:field="*{email}" class="form-control" th:errorclass="is-invalid" aria-describedby="email-error" maxlength="100" autocomplete="email" required>
                        <div id="email-error" class="invalid-feedback" th:errors="*{email}"></div>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Contraseña</label>
                        <input type="password" id="password" name="password" class="form-control" th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'" aria-describedby="password-error password-help" maxlength="72" autocomplete="new-password" required>
                        <div id="password-error" class="invalid-feedback" th:errors="*{password}"></div>
                        <div id="password-help" class="form-text">Máximo 72 bytes UTF-8. Si hay errores, vuelve a ingresar la contraseña.</div>
                    </div>
                    <div class="mb-4">
                        <label for="rol" class="form-label">Rol</label>
                        <select id="rol" th:field="*{rol}" class="form-select" th:errorclass="is-invalid" aria-describedby="rol-error" required>
                            <option value="ADMIN">ADMIN</option><option value="CAJERO">CAJERO</option>
                        </select>
                        <div id="rol-error" class="invalid-feedback" th:errors="*{rol}"></div>
                    </div>
                    <div class="d-flex justify-content-end gap-2 flex-wrap">
                        <a class="btn btn-outline-secondary" th:href="@{/usuarios}">Cancelar</a>
                        <button class="btn btn-primary" type="submit">Guardar usuario</button>
                    </div>
                </form>
            </div>
        </section>
    </main>
</div>
<th:block th:replace="~{fragments/scripts :: scripts}"></th:block>
</body>
</html>
