<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Inventario')}"></head>
<body class="admin-layout">
<aside th:replace="~{fragments/sidebar :: sidebar('inventario')}"></aside>
<div class="admin-shell">
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<main class="admin-content">

<div class="page-heading">
 <div><p class="eyebrow">Gestión de inventario</p><h1>Productos</h1><p class="text-secondary mb-0">Consulta el catálogo y registra nuevos productos.</p></div>
 <a class="btn btn-primary" th:href="@{/productos/nuevo}">+ Nuevo producto</a>
</div>
<section class="card" aria-labelledby="catalogo-title">
 <div class="card-header d-flex justify-content-between align-items-center gap-3">
  <h2 id="catalogo-title" class="h6 mb-0">Catálogo de productos</h2>
  <span class="badge badge-soft" th:text="|${#lists.size(productos)} registros|"></span>
 </div>
 <div class="table-responsive">
  <table id="productos-table" class="table table-striped table-hover align-middle mb-0 w-100">
   <caption class="visually-hidden">Productos, categorías, precios y existencias</caption>
   <thead><tr>
    <th scope="col">ID</th><th scope="col">Producto</th><th scope="col">Código de barras</th><th scope="col">Categoría</th>
    <th scope="col" class="text-end">Precio</th><th scope="col" class="text-end">Stock</th><th scope="col" class="text-end">Acciones</th>
   </tr></thead>
   <tbody>
    <tr th:each="producto : ${productos}">
     <td class="text-secondary" th:text="${producto.id}"></td>
     <td class="fw-semibold" th:text="${producto.nombre}"></td>
     <td th:text="${#strings.isEmpty(producto.codigoBarras) ? '—' : producto.codigoBarras}"></td>
     <td th:text="${producto.categoria != null ? producto.categoria.nombre : 'Sin categoría'}"></td>
     <td class="text-end numeric" th:text="${#numbers.formatDecimal(producto.precio, 1, 'COMMA', 2, 'POINT')}"></td>
     <td class="text-end"><span class="badge badge-soft" th:text="${producto.stock}"></span></td>
     <td class="text-end text-nowrap"><a class="btn btn-outline-primary btn-sm me-1" th:href="@{/productos/editar/{id}(id=${producto.id})}" th:attr="aria-label=|Editar ${producto.nombre}|"><i class="fa-solid fa-pen me-1" aria-hidden="true"></i>Editar</a><a class="btn btn-outline-danger btn-sm" th:href="@{/productos/eliminar/{id}(id=${producto.id})}"
      th:attr="aria-label=|Eliminar ${producto.nombre}|"
      onclick="return confirm('¿Eliminar este producto? También se eliminarán sus detalles de venta asociados.');">Eliminar</a></td>
    </tr>
   </tbody>
  </table>
 </div>
</section>
</main>
</div><th:block th:replace="~{fragments/scripts :: scripts}"></th:block>
</body>
</html>
