<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header th:fragment="navbar" sec:authorize="hasRole('ADMIN')" class="admin-topbar navbar bg-white border-bottom px-4">
    <div class="d-flex align-items-center gap-3">
        <button class="btn btn-outline-secondary d-lg-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebar" aria-controls="sidebar" aria-label="Abrir menú"><i class="fa-solid fa-bars" aria-hidden="true"></i></button>
        <span class="fw-semibold">Panel administrativo</span>
    </div>
    <span class="small text-secondary d-none d-sm-inline"><i class="fa-solid fa-user me-2" aria-hidden="true"></i><span sec:authentication="name">Usuario</span></span>
</header>
<header th:fragment="cajeroNavbar" sec:authorize="hasRole('CAJERO')" class="navbar navbar-dark app-navbar">
    <nav class="container d-flex flex-wrap align-items-center gap-3" aria-label="Navegación del cajero">
        <button class="btn btn-outline-light d-lg-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebar" aria-controls="sidebar" aria-label="Abrir menú"><i class="fa-solid fa-bars" aria-hidden="true"></i></button>
        <a class="navbar-brand" th:href="@{/cajero/dashboard}"><span class="brand-mark" aria-hidden="true">POS</span><span>Sistema POS</span></a>
        <div class="d-flex align-items-center flex-wrap gap-3 ms-sm-auto">
            <a class="nav-link text-white" th:href="@{/cajero/dashboard}">Inicio</a>
            <a class="nav-link text-white" th:href="@{/ventas/nueva}">Punto de Venta</a>
            <span class="text-white-50 small" sec:authentication="name">Cajero</span>
            <form th:action="@{/logout}" method="post" class="m-0">
                <button class="btn btn-outline-light btn-sm" type="submit">Cerrar sesión</button>
            </form>
        </div>
    </nav>
</header>
</body>
</html>
