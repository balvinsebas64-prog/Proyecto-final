<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Usuarios')}"></head>
<body class="admin-layout">
<aside th:replace="~{fragments/sidebar :: sidebar('usuarios')}"></aside>
<div class="admin-shell">
    <header th:replace="~{fragments/navbar :: navbar}"></header>
    <main class="admin-content">
        <div class="page-heading">
            <div><p class="eyebrow">Administración</p><h1>Usuarios</h1><p class="text-secondary mb-0">Administra los accesos del personal al sistema.</p></div>
            <a class="btn btn-primary" th:href="@{/usuarios/nuevo}">+ Nuevo Usuario</a>
        </div>
        <div th:if="${exito}" class="alert alert-success" role="status" th:text="${exito}"></div>
        <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
        <section class="card" aria-labelledby="usuarios-title">
            <div class="card-header d-flex justify-content-between align-items-center gap-3">
                <h2 id="usuarios-title" class="h6 mb-0">Usuarios registrados</h2>
                <span class="badge badge-soft" th:text="|${#lists.size(usuarios)} registros|"></span>
            </div>
            <div class="table-responsive">
                <table id="usuarios-table" class="table table-striped table-hover align-middle mb-0 w-100">
                    <caption class="visually-hidden">Nombre, correo electrónico y rol de los usuarios</caption>
                    <thead><tr><th scope="col">Nombre</th><th scope="col">Email</th><th scope="col">Rol</th><th scope="col" class="text-end">Acciones</th></tr></thead>
                    <tbody>
                    <tr th:each="usuario : ${usuarios}">
                        <td class="fw-semibold" th:text="${usuario.nombre}"></td>
                        <td th:text="${usuario.email}"></td>
                        <td><span class="badge badge-soft" th:text="${usuario.rol}"></span></td>
                        <td class="text-end">
                            <a th:if="${!#strings.equalsIgnoreCase(usuario.email, #authentication.name)}" class="btn btn-outline-danger btn-sm" th:href="@{/usuarios/eliminar/{id}(id=${usuario.id})}" th:attr="aria-label=|Eliminar a ${usuario.nombre}|" onclick="return confirm('¿Eliminar este usuario? Esta acción no se puede deshacer.');"><i class="fa-solid fa-trash me-1" aria-hidden="true"></i>Eliminar</a>
                            <span th:if="${#strings.equalsIgnoreCase(usuario.email, #authentication.name)}" class="text-secondary small">Tu cuenta</span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</div>
<th:block th:replace="~{fragments/scripts :: scripts}"></th:block>
<script th:inline="javascript">
document.addEventListener('DOMContentLoaded', () => {
    const exito = /*[[${param.exito != null and param.exito[0] == 'true'}]]*/ false;
    const eliminado = /*[[${param.eliminado != null and param.eliminado[0] == 'true'}]]*/ false;
    if ((!exito && !eliminado) || !window.Swal) return;
    const url = new URL(window.location.href);
    url.searchParams.delete('exito');
    url.searchParams.delete('eliminado');
    window.history.replaceState(window.history.state, '', url);
    Swal.fire({
        icon: 'success',
        titleText: eliminado ? '¡Usuario eliminado correctamente!' : '¡Usuario registrado correctamente!',
        confirmButtonText: 'Aceptar',
        confirmButtonColor: '#244e79',
        animation: !window.matchMedia('(prefers-reduced-motion: reduce)').matches
    });
});
</script>
</body>
</html>
