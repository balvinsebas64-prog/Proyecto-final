<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Iniciar sesión')}"></head>
<body class="login-page">
<main class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
    <div class="row justify-content-center w-100 g-0">
        <div class="col-12 col-md-7 col-lg-5 col-xl-4">
            <section class="card login-card" aria-labelledby="login-title">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <span class="brand-mark bg-light mb-3" aria-hidden="true">POS</span>
                        <p class="eyebrow">Sistema POS</p>
                        <h1 id="login-title" class="h3 mb-2">Iniciar sesión</h1>
                        <p class="text-secondary mb-0">Accede para administrar tu inventario.</p>
                    </div>

                    <div th:if="${param.error}" class="alert alert-danger" role="alert">
                        Correo o contraseña incorrectos.
                    </div>
                    <div th:if="${param.logout}" class="alert alert-success" role="status">
                        Has cerrado sesión correctamente.
                    </div>

                    <form action="/login" th:attr="action=@{/login}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <div class="mb-3">
                            <label for="username" class="form-label">Correo electrónico</label>
                            <input type="email" class="form-control" id="username" name="username"
                                   autocomplete="username" placeholder="tu@correo.com" required autofocus>
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label">Contraseña</label>
                            <input type="password" class="form-control" id="password" name="password"
                                   autocomplete="current-password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Ingresar</button>
                    </form>
                </div>
            </section>
        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
